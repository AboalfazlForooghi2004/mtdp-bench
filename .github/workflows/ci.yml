name: ci

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install analysis dependencies
        run: pip install pyyaml jinja2

      - name: Byte-compile every Python module
        run: python -m compileall -q images prov orch harv nb sim

      - name: Parse every YAML manifest
        run: python scripts/validate_yaml.py

      - name: Unit tests (isolation metrics + statistics)
        run: python -m unittest discover -s nb/tests -t . -v

      - name: Render tenant manifests at every campaign density
        run: |
          for d in 10 50 100 200; do
            python prov/provision.py --density "$d" --summary
            python prov/provision.py --density "$d" -o "/tmp/t-$d.yaml"
            python - <<PY
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/t-$d.yaml")) if d]
          kinds = {}
          for o in docs:
              kinds[o["kind"]] = kinds.get(o["kind"], 0) + 1
          print("density $d ->", len(docs), "objects", kinds)
          assert kinds["Namespace"] == $d
          assert kinds["Service"] == $d * 6
          PY
          done

      - name: Determinism -- identical seed must yield identical manifests
        run: |
          python prov/provision.py --density 50 -o /tmp/a.yaml
          python prov/provision.py --density 50 -o /tmp/b.yaml
          cmp /tmp/a.yaml /tmp/b.yaml

      - name: Shell syntax
        run: bash -n scripts/install-datapath.sh && bash -n scripts/run-campaign.sh
