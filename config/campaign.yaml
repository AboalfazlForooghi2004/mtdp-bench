version: 1
seed: 20260802

densities: [10, 50, 100, 200]
datapaths: [DP-IPT, DP-IPVS, DP-EBPF]
repetitions: 10
warmup_s: 120

profiles:
  W1:
    name: Steady-State
    duration_s: 600
  W2:
    name: Service Churn
    duration_s: 600
    churn_fraction: 0.05      # 5% of tenants scale +/-2 replicas
    churn_interval_s: 10
    probe: rule_program_ms
  W3:
    name: Aggressor Injection
    duration_s: 480
    quiescent_s: 300
    aggression_s: 180
    aggressor_gbps: 1.5       # constant, NOT scaled with density
  W4:
    name: Connection-Churn Stress
    duration_s: 600
    churn_new_conns_per_s: 8000
    adversarial: true

metrics:
  blast_radius_threshold: 0.20
  br_threshold_sweep: [0.10, 0.15, 0.20, 0.25, 0.30, 0.50]
  latency_samples: 5000

sink:
  influx_url: http://influxdb.mtdp-system.svc.cluster.local:8086
  bucket: mtdp
  org: mtdp
