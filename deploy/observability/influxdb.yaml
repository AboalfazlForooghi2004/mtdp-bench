apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: mtdp-system
spec:
  selector: {app.kubernetes.io/name: influxdb}
  ports: [{name: http, port: 8086, targetPort: 8086}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  namespace: mtdp-system
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: influxdb}
  template:
    metadata:
      labels: {app.kubernetes.io/name: influxdb}
    spec:
      # Pinned to a control-plane node so the metrics store never competes for
      # CPU or NIC with the worker nodes under measurement.
      nodeSelector: {node-role.kubernetes.io/control-plane: ""}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: influxdb
          image: influxdb:2.7-alpine
          ports: [{containerPort: 8086}]
          env:
            - {name: DOCKER_INFLUXDB_INIT_MODE, value: setup}
            - {name: DOCKER_INFLUXDB_INIT_USERNAME, value: mtdp}
            - {name: DOCKER_INFLUXDB_INIT_ORG, value: mtdp}
            - {name: DOCKER_INFLUXDB_INIT_BUCKET, value: mtdp}
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              valueFrom: {secretKeyRef: {name: influxdb-auth, key: password}}
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: influxdb-auth, key: token}}
          volumeMounts: [{name: data, mountPath: /var/lib/influxdb2}]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "4", memory: 8Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 50Gi}}
