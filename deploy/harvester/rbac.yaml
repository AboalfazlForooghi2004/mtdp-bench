apiVersion: v1
kind: Namespace
metadata:
  name: mtdp-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtdp-harvester
  namespace: mtdp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mtdp-harvester
rules:
  # Read-only. The harvester observes; it must never mutate the cluster it is
  # measuring.
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mtdp-harvester
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mtdp-harvester
subjects:
  - kind: ServiceAccount
    name: mtdp-harvester
    namespace: mtdp-system
