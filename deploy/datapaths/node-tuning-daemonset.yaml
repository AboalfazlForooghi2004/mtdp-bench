# Applies the P1 sysctl invariants IDENTICALLY on every worker, for every
# datapath arm. Without this, DP-IPT/DP-IPVS silently run with a conntrack
# table 4x smaller than the eBPF arm and the comparison is invalid.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mtdp-node-tuning
  namespace: mtdp-system
  labels: {app.kubernetes.io/name: mtdp-node-tuning}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: mtdp-node-tuning}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mtdp-node-tuning}
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      initContainers:
        - name: sysctl
          image: busybox:1.36
          securityContext: {privileged: true}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              sysctl -w net.netfilter.nf_conntrack_max=4194304
              sysctl -w net.netfilter.nf_conntrack_buckets=1048576
              sysctl -w net.core.somaxconn=4096
              sysctl -w net.ipv4.tcp_tw_reuse=1
              sysctl -w net.ipv4.ip_local_port_range="10000 65535"
              sysctl -w net.ipv4.tcp_max_syn_backlog=8192
              sysctl -w fs.file-max=2097152
              echo "mtdp: sysctl invariants applied"
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests: {cpu: 10m, memory: 16Mi}
