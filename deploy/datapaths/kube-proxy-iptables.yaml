# DP-IPT: stock kube-proxy in iptables mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-proxy
  namespace: kube-system
data:
  config.conf: |-
    apiVersion: kubeproxy.config.k8s.io/v1alpha1
    kind: KubeProxyConfiguration
    mode: "iptables"
    clusterCIDR: "10.244.0.0/16"
    iptables:
      masqueradeAll: false
      masqueradeBit: 14
      minSyncPeriod: 1s
      syncPeriod: 30s
    conntrack:
      maxPerCore: 0
      min: 4194304
      tcpEstablishedTimeout: 86400s
      tcpCloseWaitTimeout: 3600s
